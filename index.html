
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Asistente Virtual</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #17152b, #514080);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .app {
      width: 90%;
      max-width: 420px;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
      background: #25213d;
      border-radius: 24px;
      box-shadow: 0 10px 40px #0005;
    }
    .orb {
      width: 90px;
      height: 90px;
      margin: 20px auto;
      border-radius: 50%;
      background: linear-gradient(135deg, #b9a4ff, #6e5bdf);
      box-shadow: 0 0 35px #9882ff88;
    }
    p { color: #d5d0eb; line-height: 1.5; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #716795;
      background: #17152b;
      color: white;
      font-size: 16px;
      margin: 12px 0;
    } 
    button {
      padding: 13px 18px;
      margin: 5px;
      border: 0;
      border-radius: 12px;
      background: #9a83ff;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    #respuesta { white-space: pre-wrap; }
  </style>
</head>
<body>
  <main class="app">
    <div class="orb"></div>
    <h1>Mi asistente virtual</h1>
    <p>¡Hola! Soy tu asistente. Escribe algo y puedo leértelo en voz alta.</p>

    <input id="mensaje" placeholder="Escribe aquí..." />
    <div>
      <button onclick="responder()">Enviar</button>
      <button onclick="escuchar()">🎙️ Hablar</button>
    </div>
    <p id="respuesta" aria-live="polite"></p>
  </main>

  <script>
    function responder() {
      const entrada = document.getElementById("mensaje");
      const texto = entrada.value.trim();
      if (!texto) {
        document.getElementById("respuesta").textContent =
          "Escribe algo primero para conversar conmigo.";
        return;
      }
      const respuesta = "¡Te escucho! Has escrito: " + texto +
        ". Todavía estoy aprendiendo a responder preguntas con inteligencia artificial.";
      document.getElementById("respuesta").textContent = respuesta;

      if ("speechSynthesis" in window) {
        const voz = new SpeechSynthesisUtterance(respuesta);
        voz.lang = "es-MX";
        speechSynthesis.cancel();
        speechSynthesis.speak(voz);
      }
    }

    function escuchar() {
      const Reconocimiento =
        window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Reconocimiento) {
        document.getElementById("respuesta").textContent =
          "Tu navegador no admite el reconocimiento de voz. Prueba con otro navegador compatible.";
        return;
      }
      const reconocimiento = new Reconocimiento();
      reconocimiento.lang = "es-MX";
      reconocimiento.onresult = function(event) {
        document.getElementById("mensaje").value =
          event.results[0][0].transcript;
        responder();
      };
      reconocimiento.onerror = function() {
        document.getElementById("respuesta").textContent =
          "No pude captar tu voz. Revisa el permiso del micrófono.";
      };
      reconocimiento.start();
    }
  </script>
</body>
</html>
